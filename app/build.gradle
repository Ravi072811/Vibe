plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvvibe.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvvibe.launcher'
        minSdk 22          // Fire OS 5 and newer
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
// No third-party libraries: the launcher uses only the Android framework,
// so it stays small and fast on the Firestick's limited RAM.
